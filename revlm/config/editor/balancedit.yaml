_name: balancedit
edit_lr: 1e-3
n_iter: 500
eps: 0.1
dist_fn: cos  # Options: euc, cos
val_init: warm  # Options: cold, warm
val_train: standard  # Options: standard, adv
replacement: replace_all  # Options: replace_all, replace_last, replace_prompt
eps_expand: coverage  # Options: coverage, moving_average
num_pert: 10
alpha: 0.5  # Balance between rephrase and locality distances
early_stop_patience: 50  # Stop training if loss doesn't decrease for N iterations

